name: Verify Task 5

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Task5MovieStore.sln

      - name: Build
        run: dotnet build Task5MovieStore.sln --configuration Release --no-restore

      - name: Run deterministic checks
        run: dotnet run --project tests/Task5MovieStore.SmokeTests/Task5MovieStore.SmokeTests.csproj --configuration Release --no-build
